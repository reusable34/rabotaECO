services:
  db:
    image: postgres:15-alpine
    container_name: eco_db
    privileged: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eco_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eco_pass}
      POSTGRES_DB: ${POSTGRES_DB:-eco_client}
    ports:
      - "5433:5432"  # Изменен порт, чтобы не конфликтовать
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eco_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eco_network

  backend:
    image: php:8.2-apache
    container_name: eco_backend
    privileged: true
    ports:
      - "8080:80"  # Backend на 8080 (не конфликтует с 80)
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-eco_client}
      DB_USER: ${POSTGRES_USER:-eco_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eco_pass}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    command: >
      bash -c "
      apt-get update -qq &&
      apt-get install -y -qq libpq-dev libzip-dev unzip git curl wget &&
      docker-php-ext-install pdo pdo_pgsql zip &&
      curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
      cd /var/www/html &&
      composer install --no-dev --optimize-autoloader --no-interaction --quiet &&
      chmod -R 777 storage runtime &&
      a2enmod rewrite &&
      apache2-foreground
      "
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eco_network

  frontend:
    image: node:20-alpine
    container_name: eco_frontend
    privileged: true
    ports:
      - "3001:3000"  # Frontend на 3001 (не конфликтует с 3381)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8080}
      NEXT_PUBLIC_ENV: ${ENV:-production}
    command: >
      sh -c "
      npm install &&
      npm run build &&
      npm start
      "
    depends_on:
      backend:
        condition: service_started
    networks:
      - eco_network

  adminer:
    image: adminer:latest
    container_name: eco_adminer
    privileged: true
    ports:
      - "8082:8080"  # Adminer на 8082 (не конфликтует)
    depends_on:
      - db
    networks:
      - eco_network

volumes:
  postgres_data:
  backend_storage:

networks:
  eco_network:
    driver: bridge

