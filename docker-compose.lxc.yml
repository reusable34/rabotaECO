services:
  db:
    image: postgres:15-alpine
    container_name: eco_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eco_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eco_pass}
      POSTGRES_DB: ${POSTGRES_DB:-eco_client}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eco_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eco_network
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    privileged: false
      - seccomp:unconfined
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN
    privileged: false

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eco_backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-eco_client}
      DB_USER: ${POSTGRES_USER:-eco_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eco_pass}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eco_network
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    privileged: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eco_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8080}
      NEXT_PUBLIC_ENV: ${ENV:-production}
    depends_on:
      backend:
        condition: service_started
    networks:
      - eco_network
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    privileged: false

  adminer:
    image: adminer:latest
    container_name: eco_adminer
    ports:
      - "8082:8080"
    depends_on:
      - db
    networks:
      - eco_network
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    privileged: false

volumes:
  postgres_data:
  backend_storage:

networks:
  eco_network:
    driver: bridge

